plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'de.undercouch.download'
}

android {
    namespace 'org.tensorflow.lite.examples.imageclassification'
    compileSdk 34

    defaultConfig {
        applicationId "org.tensorflow.lite.examples.imageclassification"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    androidResources {
        noCompress 'tflite'
    }
}

project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
project.ext.TEST_ASSETS_DIR = projectDir.toString() + '/src/androidTest/assets'

// Comentado para no descargar modelos por defecto y usar solo tus assets
// apply from: 'download_models.gradle'

dependencies {
    // App compat and UI things
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation library
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'

    // CameraX core library
    def camerax_version = '1.3.1'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // Unit & Instrumented testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // LiteRT actualizado (soporta tu modelo TF 2.21.0)
    implementation 'com.google.ai.edge.litert:litert:1.4.0'

    // Task Vision solo para las clases de UI (Category/Classifications)
    implementation('org.tensorflow:tensorflow-lite-task-vision:0.4.4') {
        exclude group: 'org.tensorflow', module: 'tensorflow-lite'
        exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
    }
}

configurations.all {
    exclude group: 'org.tensorflow', module: 'tensorflow-lite'
    exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
}